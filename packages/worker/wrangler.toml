name = "bodobako-worker"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RoomRegistry"

[[durable_objects.bindings]]
name = "USER_REGISTRY"
class_name = "UserRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "RoomRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserRegistry"]

[vars]
FIREBASE_PROJECT_ID = "bodobako-1c07a"

# シークレット（コードには書かない。以下のコマンドで登録）:
#   npx wrangler secret put STRIPE_SECRET_KEY --config packages/worker/wrangler.toml
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET --config packages/worker/wrangler.toml
# ローカル開発時は packages/worker/.dev.vars に以下を記載:
#   STRIPE_SECRET_KEY=sk_test_...
#   STRIPE_WEBHOOK_SECRET=whsec_...
