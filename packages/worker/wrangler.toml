name = "bodobako"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM_SESSION"
class_name = "RoomSession"

# R2: ユーザーデータストレージ（UserRegistry DO の移行先）
[[r2_buckets]]
binding = "USER_DATA"
bucket_name = "bodobako-user-data"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "RoomRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserRegistry"]

[[migrations]]
tag = "v3"
renamed_classes = [{from = "RoomDO", to = "RoomSession"}]
deleted_classes = ["RoomRegistry"]

[[migrations]]
tag = "v4"
deleted_classes = ["UserRegistry"]

[vars]
FIREBASE_PROJECT_ID = "bodobako-1c07a"
