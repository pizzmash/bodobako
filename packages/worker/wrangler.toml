name = "bodobako"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM_SESSION"
class_name = "RoomSession"

[[durable_objects.bindings]]
name = "USER_REGISTRY"
class_name = "UserRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "RoomRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserRegistry"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RoomSession"]

[vars]
FIREBASE_PROJECT_ID = "bodobako-1c07a"
